<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="badgeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF6D6"/>
      <stop offset="30%" stop-color="#E6CF8B"/>
      <stop offset="70%" stop-color="#C9A24B"/>
      <stop offset="100%" stop-color="#7A5612"/>
    </linearGradient>

    <radialGradient id="badgeBurgundy" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#6B1A2B"/>
      <stop offset="60%" stop-color="#4A0E1B"/>
      <stop offset="100%" stop-color="#24050C"/>
    </radialGradient>

    <filter id="badgeShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Outer Beaded Gold Rim -->
  <circle cx="100" cy="100" r="94" fill="url(#badgeGold)" stroke="#5E400B" stroke-width="2" filter="url(#badgeShadow)"/>
  
  <!-- Beaded dots ring -->
  <g fill="#4A0E1B">
    <!-- 24 beads around perimeter -->
    <circle cx="100" cy="12" r="2.5"/><circle cx="123" cy="15" r="2.5"/><circle cx="144" cy="24" r="2.5"/>
    <circle cx="162" cy="38" r="2.5"/><circle cx="176" cy="56" r="2.5"/><circle cx="185" cy="77" r="2.5"/>
    <circle cx="188" cy="100" r="2.5"/><circle cx="185" cy="123" r="2.5"/><circle cx="176" cy="144" r="2.5"/>
    <circle cx="162" cy="162" r="2.5"/><circle cx="144" cy="176" r="2.5"/><circle cx="123" cy="185" r="2.5"/>
    <circle cx="100" cy="188" r="2.5"/><circle cx="77" cy="185" r="2.5"/><circle cx="56" cy="176" r="2.5"/>
    <circle cx="38" cy="162" r="2.5"/><circle cx="24" cy="144" r="2.5"/><circle cx="15" cy="123" r="2.5"/>
    <circle cx="12" cy="100" r="2.5"/><circle cx="15" cy="77" r="2.5"/><circle cx="24" cy="56" r="2.5"/>
    <circle cx="38" cy="38" r="2.5"/><circle cx="56" cy="24" r="2.5"/><circle cx="77" cy="15" r="2.5"/>
  </g>

  <!-- Inner Gold Inlay & Burgundy Field -->
  <circle cx="100" cy="100" r="84" fill="none" stroke="url(#badgeGold)" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="80" fill="url(#badgeBurgundy)" stroke="#C9A24B" stroke-width="2"/>

  <!-- Laurel Wreath in Medal -->
  <g fill="url(#badgeGold)" opacity="0.6">
    <path d="M 45 105 C 43 130 65 155 100 162 C 100 157 68 150 53 125 C 47 115 45 105 45 105 Z"/>
    <path d="M 155 105 C 157 130 135 155 100 162 C 100 157 132 150 147 125 C 153 115 155 105 155 105 Z"/>
  </g>

  <!-- Mini Sir Disco Bust inside badge -->
  <g id="mini-sir-disco" transform="translate(100, 105) scale(0.48)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="90" ry="85" fill="#FFFDF7" stroke="#C8B38E" stroke-width="3"/>
    <!-- Ermine Collar -->
    <path d="M -70 -10 Q 0 20 70 -10 Q 80 25 65 45 Q 0 70 -65 45 Q -80 25 -70 -10 Z" fill="#FAF6EE" stroke="#C9A24B" stroke-width="3"/>
    <!-- Jabot & Brooch -->
    <path d="M -15 20 Q 0 35 15 20 L 12 50 Q 0 60 -12 50 Z" fill="#FFFFFF" stroke="#DDD2B8" stroke-width="2"/>
    <circle cx="0" cy="18" r="9" fill="url(#badgeGold)"/>
    <circle cx="0" cy="18" r="5" fill="#6B1A2B"/>
    <!-- Face: Left eye wink, right eye sparkle with monocle -->
    <path d="M -50 -10 Q -35 -25 -20 -10" fill="none" stroke="#2D1A10" stroke-width="4.5" stroke-linecap="round"/>
    <ellipse cx="38" cy="-14" rx="12" ry="15" fill="#24110A"/>
    <circle cx="35" cy="-18" r="5" fill="#FFFFFF"/>
    <!-- Monocle -->
    <circle cx="38" cy="-14" r="22" fill="#C9E6F5" fill-opacity="0.25" stroke="url(#badgeGold)" stroke-width="3"/>
    <!-- Monocle chain -->
    <path d="M 60 -14 C 75 10 50 35 15 25" fill="none" stroke="url(#badgeGold)" stroke-width="2" stroke-dasharray="2,3"/>
    <!-- Cheek blush -->
    <circle cx="-45" cy="10" r="14" fill="#FF7B89" opacity="0.5"/>
    <circle cx="45" cy="10" r="14" fill="#FF7B89" opacity="0.5"/>
    <!-- Smile -->
    <path d="M -12 8 Q 0 16 12 8" fill="none" stroke="#381D14" stroke-width="3" stroke-linecap="round"/>
    <!-- Crown -->
    <g transform="translate(-10, -90) rotate(12)">
      <ellipse cx="0" cy="12" rx="26" ry="7" fill="url(#badgeGold)"/>
      <path d="M -22 10 L -20 -4 Q -10 2 0 -16 Q 10 2 20 -4 L 22 10 Z" fill="url(#badgeGold)" stroke="#6E4D0C" stroke-width="1.5"/>
      <circle cx="0" cy="-16" r="4" fill="#AF1E3A"/>
    </g>
  </g>

  <!-- Arced Text at top & bottom -->
  <path id="badgeTextArcTop" d="M 35 100 A 65 65 0 0 1 165 100" fill="none"/>
  <path id="badgeTextArcBottom" d="M 165 100 A 65 65 0 0 1 35 100" fill="none"/>

  <text fill="url(#badgeGold)" font-family="'Cinzel', serif" font-size="8.5" font-weight="700" letter-spacing="2.5">
    <textPath href="#badgeTextArcTop" startOffset="50%" text-anchor="middle">
      SIR DISCO • OFFICIAL MASCOT
    </textPath>
  </text>

  <text fill="url(#badgeGold)" font-family="'Cinzel', serif" font-size="8" font-weight="700" letter-spacing="2.5">
    <textPath href="#badgeTextArcBottom" startOffset="50%" text-anchor="middle">
      HIMSI UMN • DISCO XIV
    </textPath>
  </text>
</svg>
