<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 520" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bodyShading" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="60%" stop-color="#F7EED9"/>
      <stop offset="100%" stop-color="#E5D3AF"/>
    </linearGradient>

    <linearGradient id="capeVelvet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7D1D31"/>
      <stop offset="45%" stop-color="#551221"/>
      <stop offset="100%" stop-color="#300711"/>
    </linearGradient>

    <linearGradient id="capeFold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#450E1B"/>
      <stop offset="50%" stop-color="#6E1B2D"/>
      <stop offset="100%" stop-color="#320711"/>
    </linearGradient>

    <linearGradient id="crownGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF6D6"/>
      <stop offset="35%" stop-color="#F2D27A"/>
      <stop offset="70%" stop-color="#C9A24B"/>
      <stop offset="100%" stop-color="#805F19"/>
    </linearGradient>

    <linearGradient id="goldChain" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8C86D"/>
      <stop offset="100%" stop-color="#A67B1E"/>
    </linearGradient>

    <linearGradient id="menuLeather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A0E1B"/>
      <stop offset="50%" stop-color="#2E0811"/>
      <stop offset="100%" stop-color="#1A0308"/>
    </linearGradient>

    <linearGradient id="menuParchment" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FAF6EE"/>
      <stop offset="100%" stop-color="#F0E5CC"/>
    </linearGradient>

    <radialGradient id="blushGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF7B89" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FF7B89" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="pedestalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F4E09E" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#C9A24B" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#4A0E1B" stop-opacity="0"/>
    </radialGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#1A040A" flood-opacity="0.35"/>
    </filter>

    <filter id="monocleGlass">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <filter id="boardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Mascot -->
  <circle cx="250" cy="270" r="190" fill="url(#pedestalGlow)"/>

  <!-- Back of Cape (Trailing Velvet) -->
  <g id="cape-back">
    <path d="M 140 220 
             C 100 280, 80 390, 120 440 
             C 160 455, 340 455, 380 440 
             C 420 390, 400 280, 360 220 
             Z" 
          fill="url(#capeVelvet)" stroke="#22040B" stroke-width="2"/>
    <path d="M 125 435 Q 250 460 375 435 L 360 448 Q 250 470 140 448 Z" fill="#1C0308"/>
  </g>

  <!-- Mascot Body (Chibi Round Shape) -->
  <g id="body" filter="url(#softShadow)">
    <!-- Main Chubby Torso/Head -->
    <ellipse cx="250" cy="255" rx="120" ry="115" fill="url(#bodyShading)" stroke="#C8B38E" stroke-width="2.5"/>
    
    <!-- Cute Chibi Feet / Boots -->
    <g id="feet">
      <path d="M 195 360 C 180 360 170 375 180 388 C 190 398 215 398 225 388 C 230 378 220 360 195 360 Z" fill="#2E0811" stroke="#C9A24B" stroke-width="1.5"/>
      <ellipse cx="202" cy="378" rx="8" ry="4" fill="#6B1A2B"/>
      <path d="M 305 360 C 320 360 330 375 320 388 C 310 398 285 398 275 388 C 270 378 280 360 305 360 Z" fill="#2E0811" stroke="#C9A24B" stroke-width="1.5"/>
      <ellipse cx="298" cy="378" rx="8" ry="4" fill="#6B1A2B"/>
    </g>

    <!-- Rosy Cheek Blushes -->
    <circle cx="185" cy="270" r="22" fill="url(#blushGlow)"/>
    <circle cx="315" cy="270" r="22" fill="url(#blushGlow)"/>

    <!-- FACE EXPRESSION -->
    <!-- Left Eye (Playful, charming WINK) -->
    <path d="M 175 240 Q 192 225 210 240" fill="none" stroke="#2D1A10" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 210 238 L 217 232" fill="none" stroke="#2D1A10" stroke-width="3" stroke-linecap="round"/>

    <!-- Right Eye (Sparkling open eye with monocle behind) -->
    <g id="right-eye">
      <ellipse cx="305" cy="235" rx="14" ry="18" fill="#24110A"/>
      <circle cx="302" cy="227" r="6" fill="#FFFFFF"/>
      <circle cx="312" cy="242" r="2.5" fill="#FFFFFF"/>
      <polygon points="307,235 308,232 311,235 308,238" fill="#FCEAA8"/>
    </g>

    <!-- Gentle Chibi Smile -->
    <path d="M 235 264 Q 244 274 250 268 Q 256 274 265 264" fill="none" stroke="#381D14" stroke-width="3.5" stroke-linecap="round"/>
    <ellipse cx="250" cy="274" rx="4" ry="2" fill="#FF8D9B" opacity="0.7"/>
  </g>

  <!-- MONOCLE with Chain -->
  <g id="monocle" filter="url(#monocleGlass)">
    <circle cx="305" cy="235" r="24" fill="#C9E6F5" fill-opacity="0.22" stroke="url(#crownGold)" stroke-width="3.5"/>
    <circle cx="305" cy="235" r="26.5" fill="none" stroke="#8A6318" stroke-width="0.8"/>
    <path d="M 292 220 Q 312 215 324 228" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
    <rect x="328" y="232" width="5" height="6" rx="1.5" fill="url(#crownGold)"/>
    <path d="M 332 237 C 360 270, 340 320, 275 322" fill="none" stroke="url(#goldChain)" stroke-width="2" stroke-linecap="round" stroke-dasharray="2,3"/>
  </g>

  <!-- Front Royal Velvet Cape & Ermine Collar -->
  <g id="cape-front">
    <path d="M 135 235 C 120 270, 125 330, 145 350 C 160 320, 165 265, 160 235 Z" fill="url(#capeFold)" stroke="#2B050E" stroke-width="1.5"/>
    <path d="M 365 235 C 380 270, 375 330, 355 350 C 340 320, 335 265, 340 235 Z" fill="url(#capeFold)" stroke="#2B050E" stroke-width="1.5"/>

    <path d="M 155 240 
             Q 250 275 345 240 
             Q 360 280 345 305 
             Q 250 335 155 305 
             Q 140 280 155 240 Z" 
          fill="#FAF6EE" stroke="url(#crownGold)" stroke-width="2.5"/>
    
    <!-- Ermine spots -->
    <g fill="#240A10" opacity="0.85">
      <polygon points="185,275 188,284 182,284"/>
      <polygon points="220,290 223,299 217,299"/>
      <polygon points="280,290 283,299 277,299"/>
      <polygon points="315,275 318,284 312,284"/>
    </g>

    <!-- Golden Brooch Clasp -->
    <circle cx="250" cy="308" r="11" fill="url(#crownGold)" stroke="#5A3E09" stroke-width="1.5"/>
    <circle cx="250" cy="308" r="6.5" fill="#6B1A2B"/>
    <polygon points="250,304 251.5,307 254.5,308 251.5,309 250,312 248.5,309 245.5,308 248.5,307" fill="#FFFFFF"/>
  </g>

  <!-- Crisp White Jabot / Ruffled Cravat -->
  <g id="jabot">
    <path d="M 235 315 Q 250 328 265 315 L 268 335 Q 250 345 232 335 Z" fill="#FFFFFF" stroke="#D9CCA8" stroke-width="1.2"/>
    <path d="M 237 332 Q 250 344 263 332 L 265 352 Q 250 360 235 352 Z" fill="#F7F1DF" stroke="#D9CCA8" stroke-width="1.2"/>
    <path d="M 250 316 L 250 355" stroke="#D9CCA8" stroke-width="1" stroke-dasharray="2,2"/>
  </g>

  <!-- ====================================================================
       CLEAR, BOLD, HIGH-CONTRAST ROYAL MENU BOARD HELD BY SIR DISCO
       Text is large, sharp, and unmistakably readable!
       ==================================================================== -->
  <g id="menu-card" filter="url(#boardShadow)" transform="rotate(-4 200 350)">
    <!-- Outer Deep Burgundy Velvet / Gilded Folder -->
    <rect x="42" y="240" width="144" height="176" rx="9" fill="url(#menuLeather)" stroke="url(#crownGold)" stroke-width="3"/>
    
    <!-- Outer Gold Filigree Accent Frame -->
    <rect x="48" y="246" width="132" height="164" rx="6" fill="none" stroke="url(#crownGold)" stroke-width="1.5" stroke-dasharray="8,3"/>
    <circle cx="53" cy="251" r="3" fill="url(#crownGold)"/>
    <circle cx="175" cy="251" r="3" fill="url(#crownGold)"/>
    <circle cx="53" cy="405" r="3" fill="url(#crownGold)"/>
    <circle cx="175" cy="405" r="3" fill="url(#crownGold)"/>

    <!-- High-Contrast Crisp Ivory Parchment Sheet -->
    <rect x="54" y="252" width="120" height="152" rx="4" fill="url(#menuParchment)" stroke="#E5CF98" stroke-width="1"/>
    
    <!-- Mini Crown & Crest atop Menu -->
    <g transform="translate(114, 269) scale(0.65)">
      <polygon points="0,-16 4,-4 16,0 4,4 0,16 -4,4 -16,0 -4,-4" fill="url(#crownGold)"/>
      <circle cx="0" cy="0" r="3.5" fill="#4A0E1B"/>
    </g>

    <!-- 1. Header: ROYAL BANQUET (Large, Crisp & Bold) -->
    <text x="114" y="295" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="12" font-weight="900" fill="#4A0E1B" letter-spacing="1.5">
      ROYAL MENU
    </text>
    
    <!-- Fine Gold Accent Line -->
    <line x1="68" y1="303" x2="160" y2="303" stroke="#C9A24B" stroke-width="1.5"/>
    <circle cx="114" cy="303" r="2.5" fill="#C9A24B"/>
    
    <!-- 2. Main Script Motto: "Come & Enjoy" (Prominent, High-Contrast Wine) -->
    <text x="114" y="330" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif" font-style="italic" font-size="18.5" font-weight="900" fill="#29050D">
      "Come &amp; Enjoy"
    </text>

    <!-- 3. Event Tag: DISCO XIV (Golden Bold Ribbon Text) -->
    <rect x="70" y="344" width="88" height="22" rx="4" fill="#4A0E1B" stroke="url(#crownGold)" stroke-width="1.2"/>
    <text x="114" y="360" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="12" font-weight="900" fill="#FCE7B8" letter-spacing="2">
      DISCO XIV
    </text>

    <!-- 4. Subtitle & Cutlery Ornament at Bottom -->
    <text x="114" y="382" text-anchor="middle" font-family="'Cinzel', serif" font-size="7.5" font-weight="700" fill="#6B1A2B" letter-spacing="1">
      HIMSI UMN
    </text>
    <path d="M 98 393 L 130 393" stroke="#C9A24B" stroke-width="1"/>
    <polygon points="114,390 117,393 114,396 111,393" fill="#C9A24B"/>
  </g>

  <!-- Left Glove (Holding Menu Card firmly at edge without covering text) -->
  <g id="left-glove">
    <path d="M 172 342 
             C 188 332, 204 346, 196 366 
             C 190 376, 172 376, 162 366 
             C 155 356, 162 347, 172 342 Z" 
          fill="#FFFFFF" stroke="#C8B38E" stroke-width="2"/>
    <ellipse cx="188" cy="358" rx="5" ry="9" fill="#F4EDE0" stroke="#C8B38E" stroke-width="1"/>
    <line x1="174" y1="354" x2="182" y2="352" stroke="#DDD2B8" stroke-width="1.5"/>
    <line x1="174" y1="360" x2="183" y2="359" stroke="#DDD2B8" stroke-width="1.5"/>
  </g>

  <!-- Right Glove (Friendly Welcoming / Elegant Royal Gesture) -->
  <g id="right-glove">
    <path d="M 335 340 
             C 355 330, 385 340, 380 362 
             C 375 375, 350 378, 335 365 
             C 328 355, 328 345, 335 340 Z" 
          fill="#FFFFFF" stroke="#C8B38E" stroke-width="2"/>
    <ellipse cx="342" cy="355" rx="5" ry="9" fill="#F4EDE0" stroke="#C8B38E" stroke-width="1"/>
    <line x1="352" y1="352" x2="362" y2="350" stroke="#DDD2B8" stroke-width="1.5"/>
    <line x1="351" y1="358" x2="361" y2="357" stroke="#DDD2B8" stroke-width="1.5"/>
  </g>

  <!-- TINY GOLD CROWN (Tilted Charmingly on Head) -->
  <g id="crown" filter="url(#softShadow)" transform="translate(230, 138) rotate(14)">
    <ellipse cx="0" cy="18" rx="34" ry="9" fill="url(#crownGold)" stroke="#6E4D0C" stroke-width="2"/>
    <ellipse cx="0" cy="17" rx="28" ry="6" fill="#3D0B16"/>
    <path d="M -26 15 Q 0 -10 26 15 Z" fill="#6B1A2B"/>
    
    <path d="M -30 16 
             L -28 -2 Q -15 6 0 -18 Q 15 6 28 -2 
             L 30 16 
             Z" 
          fill="url(#crownGold)" stroke="#6E4D0C" stroke-width="2"/>

    <!-- Jewels on Crown -->
    <circle cx="0" cy="-18" r="5" fill="url(#crownGold)" stroke="#503504" stroke-width="1"/>
    <circle cx="0" cy="-18" r="2.8" fill="#AF1E3A"/>
    <circle cx="-28" cy="-2" r="3.5" fill="url(#crownGold)"/>
    <circle cx="-28" cy="-2" r="1.8" fill="#0F3D3A"/>
    <circle cx="28" cy="-2" r="3.5" fill="url(#crownGold)"/>
    <circle cx="28" cy="-2" r="1.8" fill="#0F3D3A"/>
    <ellipse cx="0" cy="20" rx="4" ry="2.5" fill="#AF1E3A"/>
    <ellipse cx="-16" cy="19" rx="3" ry="2" fill="#E6CF8B"/>
    <ellipse cx="16" cy="19" rx="3" ry="2" fill="#E6CF8B"/>

    <polygon points="4,-10 6,-8 10,-8 7,-6 8,-3 5,-5 2,-3 3,-6 0,-8 4,-8" fill="#FFFFFF" opacity="0.8"/>
  </g>
</svg>
