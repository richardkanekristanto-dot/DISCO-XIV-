<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="flourishGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7EAC7"/>
      <stop offset="50%" stop-color="#C9A24B"/>
      <stop offset="100%" stop-color="#8C6A22"/>
    </linearGradient>
  </defs>
  <!-- Victorian Baroque Corner Filigree -->
  <g fill="none" stroke="url(#flourishGold)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer corner boundary lines -->
    <path d="M 6 42 L 6 8 C 6 6.9 6.9 6 8 6 L 42 6" stroke-width="2"/>
    <path d="M 12 36 L 12 14 C 12 12.9 12.9 12 14 12 L 36 12" stroke-width="1" stroke-dasharray="2,2"/>
    
    <!-- Main leaf scrolls -->
    <path d="M 8 8 Q 28 12 36 36 C 40 48 30 58 20 52 C 10 46 16 30 26 34 C 32 36 30 46 24 45" stroke-width="1.8"/>
    <path d="M 8 8 Q 12 28 36 36 C 48 40 58 30 52 20 C 46 10 30 16 34 26 C 36 32 46 30 45 24" stroke-width="1.8"/>
    
    <!-- Small accent tendrils & dots -->
    <path d="M 22 22 Q 35 15 48 16 C 55 17 58 22 54 26" stroke-width="1.2"/>
    <path d="M 22 22 Q 15 35 16 48 C 17 55 22 58 26 54" stroke-width="1.2"/>
    <path d="M 38 38 Q 50 50 65 52" stroke-width="1.5"/>
  </g>
  <!-- Accent gold beads -->
  <g fill="url(#flourishGold)">
    <circle cx="8" cy="8" r="3.5"/>
    <circle cx="48" cy="6" r="2"/>
    <circle cx="6" cy="48" r="2"/>
    <circle cx="28" cy="28" r="2.5"/>
    <circle cx="68" cy="54" r="2"/>
    <circle cx="54" cy="68" r="2"/>
  </g>
