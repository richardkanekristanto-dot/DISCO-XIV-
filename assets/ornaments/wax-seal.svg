<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="waxBase" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#9C243B"/>
      <stop offset="45%" stop-color="#731526"/>
      <stop offset="80%" stop-color="#4A0B17"/>
      <stop offset="100%" stop-color="#24040A"/>
    </radialGradient>

    <radialGradient id="waxInner" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#550E1C"/>
      <stop offset="70%" stop-color="#3D0812"/>
      <stop offset="100%" stop-color="#6B1424"/>
    </radialGradient>

    <linearGradient id="goldImpression" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE8B2"/>
      <stop offset="50%" stop-color="#C9A24B"/>
      <stop offset="100%" stop-color="#735212"/>
    </linearGradient>

    <filter id="waxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <filter id="stampBevel">
      <feDropShadow dx="-1" dy="-1" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="1" dy="1" stdDeviation="0.8" flood-color="#FF7B90" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Irregular Wax Melt Pool -->
  <path d="M 80 12 
           C 105 10, 128 22, 138 42 
           C 148 62, 155 85, 142 110 
           C 132 128, 115 145, 92 148 
           C 70 152, 45 142, 30 130 
           C 12 115, 8 92, 14 70 
           C 18 50, 32 25, 55 16 
           C 65 12, 72 13, 80 12 Z" 
        fill="url(#waxBase)" filter="url(#waxShadow)"/>

  <!-- Wax Drips / Irregular Blobs -->
  <circle cx="28" cy="120" r="12" fill="url(#waxBase)"/>
  <circle cx="135" cy="50" r="10" fill="url(#waxBase)"/>
  <circle cx="120" cy="132" r="14" fill="url(#waxBase)"/>
  <circle cx="95" cy="148" r="8" fill="url(#waxBase)"/>

  <!-- Raised Rim of Stamped Seal -->
  <circle cx="80" cy="80" r="54" fill="none" stroke="#2B050D" stroke-width="6"/>
  <circle cx="80" cy="80" r="52" fill="none" stroke="#9E2238" stroke-width="2.5" opacity="0.6"/>

  <!-- Inner Pressed Well -->
  <circle cx="80" cy="80" r="48" fill="url(#waxInner)"/>

  <!-- Beaded Inner Ridge -->
  <circle cx="80" cy="80" r="44" fill="none" stroke="#C9A24B" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.75"/>

  <!-- Stamped Design in Center (Embossed Gold/Burgundy) -->
  <g id="seal-stamp" filter="url(#stampBevel)" transform="translate(80, 80)">
    <!-- Crown -->
    <path d="M -16 -18 L -14 -6 Q -8 -2 0 -10 Q 8 -2 14 -6 L 16 -18 Q 0 -14 -16 -18 Z" fill="url(#goldImpression)"/>
    <circle cx="0" cy="-10" r="1.5" fill="#FFE8B2"/>
    <circle cx="-16" cy="-18" r="1.5" fill="#FFE8B2"/>
    <circle cx="16" cy="-18" r="1.5" fill="#FFE8B2"/>

    <!-- Roman Numerals "XIV" -->
    <text x="0" y="8" text-anchor="middle" font-family="'Cinzel', serif" font-weight="900" font-size="20" fill="url(#goldImpression)" letter-spacing="2">
      XIV
    </text>

    <!-- Tiny Cloche / Fork Motif beneath -->
    <ellipse cx="0" cy="18" rx="14" ry="3" fill="url(#goldImpression)"/>
    <path d="M -9 18 C -9 11, 9 11, 9 18 Z" fill="url(#goldImpression)"/>
    <circle cx="0" cy="10" r="1.8" fill="url(#goldImpression)"/>

    <!-- Small Starlets -->
    <polygon points="-24,0 -22,-2 -20,0 -22,2" fill="url(#goldImpression)"/>
    <polygon points="24,0 22,-2 20,0 22,2" fill="url(#goldImpression)"/>
  </g>
</svg>
