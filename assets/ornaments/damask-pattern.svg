<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" opacity="0.12">
  <defs>
    <style>
      .damask-leaf { fill: none; stroke: #E6CF8B; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
      .damask-fill { fill: #E6CF8B; }
    </style>
  </defs>

  <!-- Center Motif -->
  <g transform="translate(60, 60)">
    <!-- Central Pomegranate / Acanthus heart -->
    <path class="damask-leaf" d="M 0 -35 C 15 -25 25 -10 25 10 C 25 25 12 35 0 42 C -12 35 -25 25 -25 10 C -25 -10 -15 -25 0 -35 Z"/>
    <path class="damask-leaf" d="M 0 -25 C 10 -15 16 -5 16 8 C 16 18 8 26 0 30 C -8 26 -16 18 -16 8 C -16 -5 -10 -15 0 -25 Z"/>
    
    <!-- Central Fleur-de-lis / Crown tip -->
    <path class="damask-fill" d="M 0 -42 C 4 -36 2 -32 0 -30 C -2 -32 -4 -36 0 -42 Z"/>
    <circle class="damask-fill" cx="0" cy="5" r="3"/>
    <circle class="damask-fill" cx="0" cy="18" r="2.2"/>
    <circle class="damask-fill" cx="0" cy="-10" r="2.2"/>

    <!-- Wing scrolls -->
    <path class="damask-leaf" d="M -8 -15 C -25 -30 -42 -10 -35 8 C -30 20 -15 18 -12 8 C -10 0 -22 2 -20 10"/>
    <path class="damask-leaf" d="M 8 -15 C 25 -30 42 -10 35 8 C 30 20 15 18 12 8 C 10 0 22 2 20 10"/>
  </g>

  <!-- Corner Motifs (quarter repeats for seamless tiling) -->
  <!-- Top Left (0, 0) -->
  <g transform="translate(0, 0)">
    <path class="damask-leaf" d="M 0 -10 C 15 5 25 15 25 30 C 25 45 15 50 0 60"/>
    <path class="damask-leaf" d="M 10 0 C -5 15 -15 25 -30 25"/>
    <circle class="damask-fill" cx="0" cy="0" r="3.5"/>
    <path class="damask-leaf" d="M 0 15 C 12 25 15 40 5 45"/>
  </g>

  <!-- Top Right (120, 0) -->
  <g transform="translate(120, 0)">
    <path class="damask-leaf" d="M 0 -10 C -15 5 -25 15 -25 30 C -25 45 -15 50 0 60"/>
    <circle class="damask-fill" cx="0" cy="0" r="3.5"/>
    <path class="damask-leaf" d="M 0 15 C -12 25 -15 40 -5 45"/>
  </g>

  <!-- Bottom Left (0, 120) -->
  <g transform="translate(0, 120)">
    <path class="damask-leaf" d="M 0 10 C 15 -5 25 -15 25 -30 C 25 -45 15 -50 0 -60"/>
    <circle class="damask-fill" cx="0" cy="0" r="3.5"/>
    <path class="damask-leaf" d="M 0 -15 C 12 -25 15 -40 5 -45"/>
  </g>

  <!-- Bottom Right (120, 120) -->
  <g transform="translate(120, 120)">
    <path class="damask-leaf" d="M 0 10 C -15 -5 -25 -15 -25 -30 C -25 -45 -15 -50 0 -60"/>
    <circle class="damask-fill" cx="0" cy="0" r="3.5"/>
    <path class="damask-leaf" d="M 0 -15 C -12 -25 -15 -40 -5 -45"/>
  </g>
</svg>
